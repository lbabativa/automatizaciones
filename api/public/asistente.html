<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva automatización · Consola StartIA</title>
<style>
:root{
  --ground:#f3f5f8; --paper:#fff; --paper-2:#eef1f6; --ink:#152238; --ink-2:#3e4c63;
  --muted:#6b778c; --line:#dde2ea; --line-2:#c3cbd8; --accent:#0f7b86; --accent-ink:#0b5d66;
  --accent-soft:#ddf0f2; --ok:#2e7d4f; --ok-soft:#e1f2e7; --warn:#a9641a; --warn-soft:#fbebd5;
  --crit:#b23a3a; --crit-soft:#f7e0e0; --shadow:0 1px 2px rgba(21,34,56,.06),0 8px 24px -12px rgba(21,34,56,.18);
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --sans:"Segoe UI",system-ui,ui-sans-serif,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0e1524; --paper:#161f31; --paper-2:#1d2839; --ink:#e8edf5; --ink-2:#c0cadb;
  --muted:#8a97ac; --line:#2a3649; --line-2:#3a475c; --accent:#4cc1ca; --accent-ink:#8fdde3;
  --accent-soft:#12303a; --ok:#6ccb92; --ok-soft:#173225; --warn:#e3a45a; --warn-soft:#3a2a14;
  --crit:#f08585; --crit-soft:#3a1c1c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
a{color:var(--accent-ink)}
[hidden]{display:none!important}
button{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.sec{background:transparent;color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--muted);border-color:transparent;padding:6px 10px}
button.ghost:hover{color:var(--ink);background:var(--paper-2)}
button.peligro{background:transparent;color:var(--crit);border-color:var(--crit)}
button.mini{padding:4px 10px;font-size:12.5px;border-radius:6px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:12px 0 4px}
.op{font-weight:400;color:var(--muted)}
select,input,textarea{width:100%;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--accent)}
input:disabled{background:var(--paper-2);color:var(--muted)}
.ayuda{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.mono{font-family:var(--mono);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);text-decoration:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.error,.aviso,.exito{border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.error{background:var(--crit-soft);color:var(--crit);white-space:pre-wrap}
.aviso{background:var(--warn-soft);color:var(--warn)}
.exito{background:var(--ok-soft);color:var(--ok)}
.card .aviso,.card .exito,.card .error{margin:10px 0 0}

header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.marca{display:flex;align-items:center;gap:10px}
.marca .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.marca b{font-size:16px} .marca small{display:block;color:var(--muted);font-size:12px}
header nav{display:flex;gap:4px;margin-left:10px;align-items:center}
header nav .cta{background:var(--accent);color:#fff;margin-left:6px}
header .der{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100% - 54px)}
.rail{background:var(--paper);border-right:1px solid var(--line);padding:22px 14px}
.rail-tit{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 8px 12px}
.rail ol{list-style:none;margin:0;padding:0}
.rail li{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:9px 8px;border-radius:9px;cursor:pointer}
.rail li:hover{background:var(--paper-2)}
.rail li.actual{background:var(--accent-soft)}
.rail li.bloqueado{cursor:not-allowed}
.rail li.bloqueado b,.rail li.bloqueado small{opacity:.55}
.rail li:not(:last-child)::after{content:"";position:absolute;left:21px;top:37px;height:calc(100% - 26px);width:2px;background:var(--line)}
.rail li.hecho:not(:last-child)::after{background:var(--ok)}
.rail .n{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.rail li.hecho .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rail li.actual .n{border-color:var(--accent);color:var(--accent-ink);background:var(--paper)}
.rail b{display:block;font-size:13.5px;line-height:1.25;margin-top:3px}
.rail small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-nota{margin:18px 8px 0}

.contenido{padding:26px 34px 60px;max-width:1060px;width:100%}
.eyebrow{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);font-weight:700}
h1{font-size:23px;line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--ink-2);max-width:70ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card > label:first-child,.card > h3 + label{margin-top:0}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}
.dos > .card{margin-bottom:0}
.dos label:first-child{margin-top:0}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.pie{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.pie .der{margin-left:auto}
.segmento{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--paper-2);border:1px solid var(--line);margin:0 0 14px}
.segmento button{background:transparent;border:0;color:var(--ink-2);padding:6px 14px;border-radius:7px}
.segmento button.act{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(21,34,56,.18)}
.card .segmento{margin:0 0 12px}

/* Cliente */
.opciones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px}
button.opcion{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);white-space:normal;font-weight:400}
button.opcion:hover{border-color:var(--line-2)}
button.opcion.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button.opcion b{font-size:14px} button.opcion small{font-size:12px;color:var(--muted)}
.codigos{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;align-items:center;margin:0}
.codigos dt{font-size:12.5px;color:var(--muted);font-weight:600}
.codigos dd{margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.valor{font-family:var(--mono);font-size:13px;background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;word-break:break-all}
.valor.clave{border:1px dashed var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.editando{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper-2);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px}

/* Datos */
.dato{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 108px 84px minmax(0,1fr) 30px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.dato.cab{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding-top:0}
.dato .interruptor{display:flex;gap:6px;align-items:center;margin:0;font-weight:500}
.opciones-dato{grid-column:1/-1}
.opciones-dato label{margin-top:0}
.rapidos{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.vacio{color:var(--muted);font-size:13.5px;padding:18px 8px;text-align:center;margin:0}
pre{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-family:var(--mono);font-size:12.5px;max-height:340px;margin:0}

/* Grabar */
.estado-pc{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:14px}
.estado-pc.ok{background:var(--ok-soft);color:var(--ok)} .estado-pc.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
ol.instr{margin:0;padding-left:20px;display:grid;gap:8px}
ol.instr li{padding-left:4px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.tecla{display:inline-block;font-family:var(--mono);font-size:11.5px;line-height:1.45;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--paper);color:var(--ink);margin-right:2px}
.gestos{display:grid;gap:8px;font-size:13px}
.gestos div{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.gr-cab{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.gr-cab .der{margin-left:auto;display:flex;gap:6px}
.lista-pasos{border:1px solid var(--line);border-radius:9px;max-height:380px;overflow:auto}
.lp{display:grid;grid-template-columns:20px 28px 118px minmax(0,1fr) 30px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.lp:last-child{border-bottom:0}
.lp.login{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--warn)}
.lp.fuera .tx,.lp.fuera .tipo{opacity:.45;text-decoration:line-through}
.lp .num{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.tipo{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--paper-2);border-radius:5px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tipo.leer{background:var(--accent-soft);color:var(--accent-ink)}
.lp .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .val{color:var(--muted);margin-left:6px}
.gr-fin{margin-top:12px;display:grid;gap:10px;justify-items:start}
.gr-fin .segmento{margin:0}
.linea-check{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin:0;font-size:13px}
.linea-check input{margin-top:3px}
.subt{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.subt:first-of-type{margin-top:0}

/* Resultado */
.devolver{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,170px);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.devolver.cab{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding-top:0}
.devolver b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devolver small{display:flex;gap:6px;align-items:center;color:var(--muted)}
.vacio-card{text-align:center;padding:28px}
.vacio-card b{display:block;font-size:15px;margin-bottom:6px}
.vacio-card p{max-width:56ch;margin:0 auto 14px;color:var(--ink-2)}

/* Probar */
button.ancho{width:100%;margin-top:16px;padding:11px}
.pr-cab{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
details{margin-top:10px}
summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted)}
.bitacora{margin-top:6px;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:240px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.bitacora div{white-space:pre-wrap} .bitacora span{color:var(--muted)} .bitacora .err{color:var(--crit)}
.capturas{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.capturas a{display:block;width:104px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.capturas img{display:block;width:100%;height:68px;object-fit:cover;object-position:top}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.pill.pendiente{background:var(--paper-2);color:var(--muted)} .pill.en_proceso{background:var(--warn-soft);color:var(--warn)}
.pill.completado{background:var(--ok-soft);color:var(--ok)} .pill.fallido{background:var(--crit-soft);color:var(--crit)}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:g 1s linear infinite;vertical-align:-2px;flex:none}
@keyframes g{to{transform:rotate(360deg)}}

/* Entregar */
.checks{display:grid;gap:2px}
.check{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:5px 0;font-size:13.5px}
.check .i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--warn);margin-top:1px}
.check.ok .i{background:var(--ok)}
.publicacion{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.siguientes{display:flex;gap:8px;flex-wrap:wrap}
.siguientes .chip{padding:6px 12px}
.config{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

@media(max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .rail ol{display:flex;overflow-x:auto;gap:4px}
  .rail li{min-width:180px}
  .rail li::after,.rail-nota{display:none}
  .dos,.tres{grid-template-columns:1fr}
  .dato{grid-template-columns:1fr 1fr}
  .dato.cab{display:none}
  .contenido{padding:20px}
}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<header>
  <div class="marca"><div class="logo">S</div><div><b>Consola StartIA</b><small>Automatizaciones</small></div></div>
  <nav><a class="chip" href="/admin/clientes">Clientes</a><a class="chip" href="/admin/flujos">Flujos</a><a class="chip" href="/admin">Consultas</a><a class="chip cta" href="/admin/nueva" aria-current="page">＋ Nueva automatización</a></nav>
  <div class="der"><span id="usuario" class="mono"></span><button class="ghost" id="btn-salir">Salir</button></div>
</header>

<div class="app">
  <aside class="rail">
    <p class="rail-tit">Nueva automatización</p>
    <ol id="rail"></ol>
    <p class="ayuda rail-nota">Cada paso se guarda como borrador al continuar. Puede cerrar esta página y retomarla desde Flujos o con este mismo enlace.</p>
  </aside>
  <main class="contenido">
    <p class="eyebrow" id="v-eyebrow"></p>
    <h1 id="v-titulo">Nueva automatización</h1>
    <p class="lead" id="v-lead"></p>
    <div id="v-msg" aria-live="polite"></div>
    <div id="v-cuerpo"><p class="vacio"><span class="spinner"></span> Cargando…</p></div>
    <div class="pie">
      <button class="ghost" id="btn-atras">← Atrás</button>
      <div class="der"><button id="btn-continuar">Continuar →</button></div>
    </div>
  </main>
</div>

<script src="/admin/integracion.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const I = window.StartiaIntegracion;

const PLACEHOLDER = { tipo: 'capturar', nombre: '01-inicio' };
const SIN_LOGIN = { url_coincide: '.' };
const RESERVADOS = ['modo', 'callback_url', 'forzar', 'prioridad'];
const SECTORES = [['salud', 'Salud'], ['banca', 'Banca'], ['seguros', 'Seguros'], ['gobierno', 'Gobierno'], ['logistica', 'Logística'], ['comercio', 'Comercio'], ['otro', 'Otro']];
const DESCR = { ir: 'Abrir URL', clic: 'Clic', escribir: 'Escribir', seleccionar: 'Elegir opción', presionar: 'Tecla', esperar: 'Esperar', leer: 'Leer valor', leer_lista: 'Leer lista', leer_tabla: 'Leer tabla', leer_lineas: 'Leer líneas', capturar: 'Captura', asignar: 'Asignar', agregar: 'Agregar', buscar: 'Buscar', transformar: 'Transformar', elegir: 'Elegir', decidir: 'Decidir', si: 'Si aparece', para_cada: 'Para cada', error: 'Error', fin: 'Fin' };
const LECTURAS = new Set(['leer', 'leer_lista', 'leer_tabla', 'leer_lineas']);
const PASOS = [
  { id: 'cliente', titulo: 'Cliente y códigos' },
  { id: 'portal', titulo: 'Portal y acceso' },
  { id: 'datos', titulo: 'Datos de entrada' },
  { id: 'grabar', titulo: 'Grabar los pasos' },
  { id: 'resultado', titulo: 'Qué devuelve' },
  { id: 'probar', titulo: 'Probar' },
  { id: 'entregar', titulo: 'Publicar y entregar' },
];

const ST = {
  i: 0, clientes: [], flujos: [], hayClave: false, workers: [],
  cliente: null, claves: {},          // claves de API completas generadas en esta sesión (solo en memoria)
  def: null, meta: null,              // borrador en edición y su resumen del servidor
  valores: {}, visto: {},             // valores de prueba y pasos revisados (sessionStorage)
  gr: null, prueba: null, pruebaOk: null, timers: [],
  modoCliente: null, modoFlujo: null, acceso: 'login', manual: new WeakSet(),
};

const almacen = {
  leer(k) { try { return JSON.parse(sessionStorage.getItem('startia:' + k) || 'null'); } catch { return null; } },
  escribir(k, v) { try { sessionStorage.setItem('startia:' + k, JSON.stringify(v)); } catch { /* sin almacenamiento */ } },
};

async function api(ruta, opciones = {}) {
  const r = await fetch('/admin/api' + ruta, { ...opciones, credentials: 'same-origin', headers: { 'content-type': 'application/json', ...(opciones.headers || {}) } });
  if (r.status === 401) { location.href = '/admin'; throw new Error('NO_AUTENTICADO'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.mensaje || j.error || ('Error ' + r.status)); e.codigo = j.error; e.detalles = j.detalles; e.datos = j; throw e; }
  return j;
}
function mensaje(html, clase = 'error') { $('#v-msg').innerHTML = html ? `<div class="${clase}">${html}</div>` : ''; if (html) $('#v-msg').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const hace = (f) => { const s = Math.max(0, Math.round((Date.now() - new Date(f).getTime()) / 1000)); return s < 60 ? `hace ${s} s` : s < 3600 ? `hace ${Math.round(s / 60)} min` : new Date(f).toLocaleString('es-CO', { hour12: false, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); };

// ---------------------------------------------------------------------------------
// Estado del flujo
// ---------------------------------------------------------------------------------
const tienePasosReales = () => !!ST.def && (ST.def.pasos || []).some((p) => !(p.tipo === 'capturar' && p.nombre === PLACEHOLDER.nombre));
const contar = (l) => (l || []).reduce((n, p) => n + 1 + contar(p.entonces) + contar(p.si_no) + contar(p.pasos), 0);
const esSinLogin = (def) => !!(def && def.sesion && def.sesion.valida_si && def.sesion.valida_si.url_coincide === '.');
const habilitadoPara = (slug) => !!(ST.meta && slug && (ST.meta.clientes || []).some((c) => c.slug === slug && c.habilitado));
const credencialesUsadas = (x) => [...new Set((JSON.stringify(x || []).match(/\{\{\s*credenciales\.(\w+)\s*\}\}/g) || []).map((m) => m.replace(/[{}\s]/g, '').split('.')[1]))];
const configUsada = (x) => [...new Set((JSON.stringify(x || {}).match(/\{\{\s*config\.(\w+)\s*\}\}/g) || []).map((m) => m.replace(/[{}\s]/g, '').split('.')[1]))];
const objTxt = (o) => (!o ? '' : o.etiqueta || o.nombre || o.texto || o.placeholder || o.selector || o.rol || '');
const textoPaso = (p) => p.titulo || (p.tipo === 'leer' ? `${p.guardar_como} ← ${p.etiqueta || objTxt(p.objetivo)}` : objTxt(p.objetivo) || p.url || p.nombre || p.tecla || '');

function variablesLeidas(pasos, out = []) {
  for (const p of pasos || []) {
    const v = p.guardar_como || (p.tipo === 'asignar' || p.tipo === 'transformar' ? p.variable : p.tipo === 'agregar' ? p.a : null);
    if (v && !out.some((o) => o.variable === v)) out.push({ variable: v, tipo: p.tipo, titulo: p.titulo || DESCR[p.tipo] || p.tipo });
    variablesLeidas(p.entonces, out); variablesLeidas(p.si_no, out); variablesLeidas(p.pasos, out);
  }
  return out;
}

function valoresDePrueba() {
  const o = {};
  for (const p of (ST.def && ST.def.parametros) || []) {
    let v = ST.valores[p.nombre];
    if (v === undefined || v === '') v = p.por_defecto !== undefined ? String(p.por_defecto) : p.tipo === 'opcion' && (p.opciones || []).length ? String(Array.isArray(p.opciones[0]) ? p.opciones[0][0] : p.opciones[0]) : '';
    if (v !== '') o[p.nombre] = v;
  }
  return o;
}

const HECHO = {
  cliente: () => !!ST.cliente,
  portal: () => !!(ST.def && ST.meta),
  datos: () => !!(ST.def && ST.meta) && ((ST.def.parametros || []).length > 0 || tienePasosReales() || !!ST.visto.datos),
  grabar: () => !!ST.meta && tienePasosReales(),
  resultado: () => !!ST.meta && tienePasosReales() && (!!ST.def.resultado || !!ST.visto.resultado),
  probar: () => !!ST.meta && (!!ST.pruebaOk || !!ST.visto.probar),
  entregar: () => !!ST.meta && ST.meta.estado === 'publicado' && !ST.meta.tieneBorrador && habilitadoPara(ST.cliente && ST.cliente.slug),
};
const puedeIr = (i) => PASOS.slice(0, i).every((p) => HECHO[p.id]());

async function cargarBase() {
  const [{ clientes }, { flujos }, { clavePublica }, estado] = await Promise.all([api('/clientes'), api('/flujos'), api('/portales'), api('/estado')]);
  ST.clientes = clientes; ST.flujos = flujos; ST.hayClave = clavePublica; ST.workers = estado.workers || [];
  if (ST.cliente) ST.cliente = clientes.find((c) => c.slug === ST.cliente.slug) || null;
}
async function cargarFlujo(nombre) {
  const f = await api('/flujos/' + encodeURIComponent(nombre));
  ST.meta = f;
  ST.def = JSON.parse(JSON.stringify(f.borrador || f.definicion));
  (ST.def.parametros || []).forEach((p) => ST.manual.add(p));
  ST.valores = almacen.leer('valores:' + nombre) || {};
  ST.visto = almacen.leer('visto:' + nombre) || {};
  ST.acceso = esSinLogin(ST.def) ? 'libre' : 'login';
  if (ST.gr && ST.gr.flujo !== nombre) ST.gr = null;
  await buscarPrueba();
}
async function guardarDef() {
  await api('/flujos/' + ST.def.nombre, { method: 'PUT', body: JSON.stringify(ST.def) });
  const [meta, { flujos }] = await Promise.all([api('/flujos/' + ST.def.nombre), api('/flujos')]);
  ST.meta = meta; ST.flujos = flujos;
  await buscarPrueba();
}
function marcarVisto(k) { ST.visto[k] = true; if (ST.def) almacen.escribir('visto:' + ST.def.nombre, ST.visto); }
function guardarValores() { if (ST.def) almacen.escribir('valores:' + ST.def.nombre, ST.valores); }

/** Última prueba del flujo con el cliente elegido; es "correcta" si terminó bien después del último cambio del borrador. */
async function buscarPrueba() {
  ST.prueba = null; ST.pruebaOk = null;
  if (!ST.meta || !ST.cliente) return;
  const { trabajos } = await api(`/trabajos?modulo=${encodeURIComponent(ST.def.nombre)}&prueba=1&cliente=${encodeURIComponent(ST.cliente.slug)}&limite=5`).catch(() => ({ trabajos: [] }));
  ST.prueba = trabajos[0] || null;
  const desde = new Date(ST.meta.actualizado).getTime();
  const publicadoSinCambios = ST.meta.estado === 'publicado' && !ST.meta.tieneBorrador;
  ST.pruebaOk = trabajos.find((t) => t.estado === 'completado' && (publicadoSinCambios || new Date(t.creado).getTime() >= desde)) || null;
}

function pintarRail() {
  const d = ST.def;

    cliente: ST.cliente ? ST.cliente.nombre : 'Elegir o crear',
    portal: d && ST.meta ? d.titulo : 'Qué hace el robot',
    datos: d && ST.meta ? plural((d.parametros || []).length, 'dato', 'datos') : 'Lo que envía el cliente',
    grabar: tienePasosReales() ? plural(contar(d.pasos), 'paso', 'pasos') : 'Clics y lecturas',
    resultado: d && d.resultado ? plural(Object.keys(d.resultado).length, 'campo', 'campos') : 'Valores de la pantalla',
    probar: ST.pruebaOk ? 'Prueba correcta' : 'Con el robot real',
    entregar: ST.meta && ST.meta.estado === 'publicado' ? `v${ST.meta.version}${habilitadoPara(ST.cliente && ST.cliente.slug) ? ' · habilitada' : ''}` : 'Clave y código',
  };
  $('#rail').innerHTML = PASOS.map((p, i) => {
    const hecho = HECHO[p.id](), ok = puedeIr(i);
    return `<li class="${i === ST.i ? 'actual' : ''} ${hecho ? 'hecho' : ''} ${ok ? '' : 'bloqueado'}" data-i="${i}" ${ok ? 'tabindex="0"' : 'aria-disabled="true"'}><span class="n">${hecho && i !== ST.i ? '✓' : i + 1}</span><span><b>${esc(p.titulo)}</b><small>${esc(notas[p.id])}</small></span></li>`;
  }).join('');
  $$('#rail li').forEach((li) => {
    const ir = () => { const i = Number(li.dataset.i); if (puedeIr(i) && i !== ST.i) irA(i); };
    li.onclick = ir; li.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ir(); } };
  });
}

function irA(i) {
  ST.timers.forEach(clearInterval); ST.timers = [];
  ST.i = i; mensaje('');
  const p = PASOS[i], v = VISTAS[p.id];
  $('#v-eyebrow').textContent = `Paso ${i + 1} de ${PASOS.length}`;
  $('#v-titulo').textContent = typeof v.titulo === 'function' ? v.titulo() : v.titulo;
  $('#v-lead').innerHTML = typeof v.lead === 'function' ? v.lead() : v.lead;
  $('#v-cuerpo').innerHTML = v.html();
  $('#btn-atras').hidden = i === 0;
  $('#btn-continuar').hidden = !v.continuar;
  $('#btn-continuar').textContent = v.textoContinuar || 'Guardar y continuar →';
  if (v.montar) v.montar();
  pintarRail(); sincronizarUrl();
  document.title = `${p.titulo} · Nueva automatización`;
}
function sincronizarUrl() {
  const q = new URLSearchParams();
  if (ST.cliente) q.set('c', ST.cliente.slug);
  if (ST.def && ST.meta) q.set('f', ST.def.nombre);
  q.set('paso', PASOS[ST.i].id);
  history.replaceState(null, '', '/admin/nueva?' + q);
}
$('#btn-atras').onclick = () => irA(Math.max(0, ST.i - 1));
$('#btn-continuar').onclick = async () => {
  const v = VISTAS[PASOS[ST.i].id], b = $('#btn-continuar');
  b.disabled = true; mensaje('');
  try { if (await v.continuar()) irA(Math.min(ST.i + 1, PASOS.length - 1)); }
  catch (e) { mensaje(esc(e.message)); }
  finally { b.disabled = false; }
};

function htmlClave(c) {
  const clave = ST.claves[c.slug];
  return `<dl class="codigos">
      <dt>Identificador</dt><dd><span class="valor">${esc(c.slug)}</span></dd>
      <dt>Clave de API</dt><dd>${clave
        ? `<span class="valor clave">${esc(clave)}</span><button type="button" class="mini" data-copiar-clave>Copiar clave</button>`
        : `<span class="valor">${esc(c.apiKeyPrefijo || 'rpa_' + c.slug + '_')}••••••••••••</span><button type="button" class="mini sec" data-rotar>Generar clave nueva</button>`}</dd>
      ${c.nit ? `<dt>NIT</dt><dd>${esc(c.nit)}</dd>` : ''}
    </dl>
    ${clave
      ? '<div class="aviso">Copie la clave ahora y entréguela por un canal seguro. Solo se guarda su huella: no se vuelve a mostrar y, si se pierde, se genera otra.</div>'
      : '<p class="ayuda">La clave completa solo se ve al generarla. Si el cliente ya la tiene, siga con ella: generar otra deja sin servicio a la anterior de inmediato.</p>'}`;
}
function montarClave(box, c, repintar) {
  const cp = box.querySelector('[data-copiar-clave]');
  if (cp) cp.onclick = (e) => I.copiar(ST.claves[c.slug], e.currentTarget);
  const rt = box.querySelector('[data-rotar]');
  if (rt) rt.onclick = async () => {
    if (!confirm(`La clave actual de ${c.nombre} dejará de funcionar de inmediato. ¿Generar una nueva?`)) return;
    try { const { apiKey } = await api(`/clientes/${c.slug}/rotar-clave`, { method: 'POST' }); ST.claves[c.slug] = apiKey; await cargarBase(); repintar(); }
    catch (e) { mensaje(esc(e.message)); }
  };
}

async function elegirCliente(slug) {
  ST.cliente = ST.clientes.find((c) => c.slug === slug) || null;
  $$('#cl-existente .opcion').forEach((o) => o.classList.toggle('sel', o.dataset.s === slug));
  await buscarPrueba();
  pintarCodigosCliente(); pintarRail(); sincronizarUrl();
}
async function crearCliente() {
  const nombre = $('#cn-nombre').value.trim(), slug = $('#cn-slug').value.trim();
  if (!nombre) return mensaje('Escriba el nombre del cliente.');
  if (!/^[a-z][a-z0-9-]{1,40}$/.test(slug)) return mensaje('El identificador va en minúsculas, números y guiones, y empieza por una letra.');
  const b = $('#cn-crear'); b.disabled = true; mensaje('');
  try {
    const r = await api('/clientes', { method: 'POST', body: JSON.stringify({ slug, nombre, nit: $('#cn-nit').value.trim() }) });
    ST.claves[r.slug] = r.apiKey;
    await cargarBase();
    ST.modoCliente = 'existente';
    ST.cliente = ST.clientes.find((c) => c.slug === r.slug) || null;
    await buscarPrueba();
    irA(0);
    mensaje(`Cliente <b>${esc(nombre)}</b> creado con sus códigos.`, 'exito');
  } catch (e) { mensaje(esc(e.message)); b.disabled = false; }
}

  box.innerHTML = `<div class="card"><h3>Códigos de ${esc(c.nombre)}</h3>${htmlClave(c)}</div>`;
  montarClave(box, c, pintarCodigosCliente);
}

    if (!/^[a-z][a-z0-9-]*$/.test(nombre)) throw new Error('El nombre técnico va en minúsculas, números y guiones.');
    if (!ST.meta && ST.flujos.some((f) => f.nombre === nombre)) throw new Error(`Ya existe una automatización llamada ${nombre}. Cambie el nombre técnico o elíjala en "Continuar una existente".`);
    const def = ST.meta ? ST.def : { nombre, titulo, sector, portal, descripcion: '', url_inicio: url, credenciales_requeridas: [], parametros: [], sesion: { valida_si: { texto_visible: 'Cerrar sesión' } }, pasos: [{ ...PLACEHOLDER }] };
    Object.assign(def, { titulo, sector, portal, url_inicio: url });
    const texto = $('#ac-valida').value.trim();
    if (ST.acceso === 'libre') {
      def.sesion = { valida_si: SIN_LOGIN };
      def.credenciales_requeridas = [];
    } else if (esSinLogin(def)) {
      def.sesion = { valida_si: { texto_visible: texto || 'Cerrar sesión' } };
    } else if (texto) {
      def.sesion = { ...def.sesion, valida_si: { texto_visible: texto } };
    }
    const usuario = $('#ac-usuario').value, pass = $('#ac-pass').value;
    if (ST.acceso === 'login' && (usuario || pass) && !ST.hayClave) throw new Error('Todavía no se pueden guardar credenciales: ningún robot ha publicado su clave pública. Déjelas vacías e inicie sesión a mano al grabar.');
    ST.def = def;
    try { await guardarDef(); }
    catch (e) { if (!ST.meta) ST.def = null; throw e; }
    if (ST.acceso === 'login' && (usuario || pass)) {
      const cuerpo = {};
      if (usuario) cuerpo.usuario = usuario;
      if (pass) cuerpo.password = pass;
      await api(`/clientes/${ST.cliente.slug}/credenciales/${portal}`, { method: 'PUT', body: JSON.stringify(cuerpo) });
      await cargarBase();
    }
    ST.valores = almacen.leer('valores:' + def.nombre) || ST.valores || {};
    return true;
  },
};

async function aplicarGrabacion() {
  const G = ST.gr;
  const login = G.moverLogin ? rangoLogin(G.pasos, G.excluidos) : null;
  const deLogin = [], consulta = [];
  G.pasos.forEach((p, i) => {
    if (G.excluidos.has(i)) return;
    const { alternativas, ...limpio } = p;
    (login && login.has(i) ? deLogin : consulta).push(limpio);
  });
  if (!deLogin.length && !consulta.length) throw new Error('No hay pasos marcados.');
  const antes = JSON.parse(JSON.stringify(ST.def));
  if (!tienePasosReales() || G.modo === 'reemplazar') ST.def.pasos = consulta.length ? consulta : [{ ...PLACEHOLDER }];
  else ST.def.pasos.push(...consulta);
  if (deLogin.length) ST.def.sesion = { ...ST.def.sesion, login: deLogin };
  ST.def.credenciales_requeridas = [...new Set([...credencialesUsadas(ST.def.pasos), ...credencialesUsadas(ST.def.sesion.login)])];
  try { await guardarDef(); } catch (e) { ST.def = antes; throw e; }
  G.aplicada = true; G.pendiente = false;
  irA(ST.i);
  mensaje(`Guardados ${consulta.length} pasos de la consulta${deLogin.length ? ` y ${deLogin.length} de inicio de sesión automático` : ''} en el borrador.`, 'exito');
}
function pintarActuales() {

}

VISTAS.resultado = {
  titulo: '¿Qué valores devuelve la API?',
  lead: 'Elija, de lo que el robot lee en pantalla, qué va en la respuesta y con qué nombre. Es lo que recibirá el sistema del cliente.',
  html() {
    const vars = variablesLeidas(ST.def.pasos);
    if (!vars.length) return `<div class="card vacio-card"><b>Todavía no se lee ningún valor</b><p>Vuelva a grabar y haga <span class="tecla">Alt</span> + clic sobre cada dato que deba devolverse: un estado, un número de autorización, una fecha. Si sigue sin lecturas, la API solo dirá si la consulta terminó.</p><button type="button" class="sec" id="rs-grabar">← Volver a grabar</button></div>`;

          ${actual.otros.length ? `<p class="ayuda">Además se conservan ${actual.otros.length} campos definidos en el editor avanzado: <span class="mono">${actual.otros.map(([k]) => esc(k)).join(', ')}</span>.</p>` : ''}
          <p class="ayuda" id="rs-nota"></p>
        </div>
        <div class="card"><h3>Así responderá la API</h3><pre id="rs-vista"></pre><p class="ayuda">Los valores reales llegan en <span class="mono">resultado</span> cuando el robot termina.</p></div>
      </div>`;
  },
  montar() {
    const volver = $('#rs-grabar');
    if (volver) { volver.onclick = () => irA(3); $('#btn-continuar').textContent = 'Continuar sin valores →'; return; }
    $$('[data-var],[data-clave]').forEach((i) => (i.oninput = i.onchange = pintarVistaResultado));
    pintarVistaResultado();
  },
  async continuar() {
    if (variablesLeidas(ST.def.pasos).length) {
      const r = construirResultado();
      if (r.error) throw new Error(r.error);
      if (r.plantilla) ST.def.resultado = r.plantilla; else delete ST.def.resultado;
      await guardarDef();
    }
    marcarVisto('resultado');
    return true;
  },
};
function mapaResultado(res) {
  const porVariable = {}, otros = [];
  for (const [k, v] of Object.entries(res || {})) {
    const m = typeof v === 'string' && /^\{\{\s*([\w.]+)\s*\}\}$/.exec(v);
    if (m && porVariable[m[1]] === undefined) porVariable[m[1]] = k; else otros.push([k, v]);
  }
  return { porVariable, otros };
}
function construirResultado() {
  const plantilla = Object.fromEntries(mapaResultado(ST.def.resultado).otros);
  const claves = new Set(Object.keys(plantilla));
  for (const chk of $$('[data-var]')) {
    if (!chk.checked) continue;
    const variable = chk.dataset.var;
    const clave = $$('[data-clave]').find((x) => x.dataset.clave === variable).value.trim();
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(clave)) return { error: `"${clave || '(vacío)'}" no sirve como nombre en la respuesta: letras, números y guion bajo.` };
    if (claves.has(clave)) return { error: `El nombre ${clave} está repetido en la respuesta.` };
    claves.add(clave);
    plantilla[clave] = `{{${variable}}}`;
  }
  return { plantilla: Object.keys(plantilla).length ? plantilla : null };
}
function pintarVistaResultado() {
  const r = construirResultado(), box = $('#rs-vista');
  if (!box) return;
  $('#rs-nota').textContent = r.plantilla ? '' : 'Sin campos marcados, la API devolverá todas las variables leídas con su nombre interno.';
  if (r.error) { box.textContent = r.error; return; }
  const ejemplo = r.plantilla ? Object.fromEntries(Object.entries(r.plantilla).map(([k, v]) => [k, typeof v === 'string' ? v.replace(/^\{\{\s*([\w.]+)\s*\}\}$/, '‹$1›') : v])) : { '‹variables leídas›': '…' };
  box.textContent = JSON.stringify({ id: '66e4c1f0a9d2…', estado: 'completado', resultado: ejemplo, duracion_ms: 42000 }, null, 2);
}
