<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola StartIA Automatizaciones</title>
<style>
:root{
  --ground:#f5f7fa; --paper:#fff; --paper-2:#eef2f7; --ink:#152238; --ink-2:#3e4c63;
  --muted:#6b778c; --line:#d9dfe8; --line-2:#c3cbd8; --accent:#0f7b86; --accent-ink:#0b5d66;
  --accent-soft:#ddf0f2; --ok:#2e7d4f; --ok-soft:#e1f2e7; --warn:#a9641a; --warn-soft:#fbebd5;
  --crit:#b23a3a; --crit-soft:#f7e0e0;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"Segoe UI",system-ui,ui-sans-serif,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0e1524; --paper:#161f31; --paper-2:#1d2839; --ink:#e8edf5; --ink-2:#c0cadb;
  --muted:#8a97ac; --line:#2a3649; --line-2:#3a475c; --accent:#4cc1ca; --accent-ink:#8fdde3;
  --accent-soft:#12303a; --ok:#6ccb92; --ok-soft:#173225; --warn:#e3a45a; --warn-soft:#3a2a14;
  --crit:#f08585; --crit-soft:#3a1c1c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--accent-ink)}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
header .badge{font-family:var(--mono);font-size:12px;color:var(--muted)}
header .estado{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--ok)} .dot.off{background:var(--crit)}
main{max-width:1160px;margin:0 auto;padding:22px;display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h2{font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 5px}
select,input,textarea{width:100%;font:inherit;background:var(--paper-2);color:var(--ink);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{font-family:var(--mono);font-size:13px;min-height:72px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:9px 14px;cursor:pointer}
button.sec{background:transparent;color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
.acciones{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink-2)}
tr:hover td{background:var(--paper-2);cursor:pointer}
.tbl-wrap{max-height:360px;overflow:auto}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.pill.pendiente{background:var(--paper-2);color:var(--muted)}
.pill.en_proceso{background:var(--warn-soft);color:var(--warn)}
.pill.completado{background:var(--ok-soft);color:var(--ok)}
.pill.fallido{background:var(--crit-soft);color:var(--crit)}
.sem{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px}
.sem.VERDE{background:var(--ok-soft);color:var(--ok)} .sem.AMARILLO{background:var(--warn-soft);color:var(--warn)} .sem.ROJO{background:var(--crit-soft);color:var(--crit)}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;font-weight:600}
.tabs button.activo{color:var(--ink);border-bottom-color:var(--accent)}
pre{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-family:var(--mono);font-size:12.5px;max-height:340px}
.capturas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.capturas a{display:block;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:150px}
.capturas img{display:block;width:100%;height:96px;object-fit:cover;object-position:top}
.vacio{color:var(--muted);font-size:13px;padding:16px 0;text-align:center}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:7px;padding:10px 12px;font-size:13px;margin-top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:8px 0}
.kv b{color:var(--muted);font-weight:600}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Consola StartIA</h1><span class="badge">Automatizaciones</span>
  <div class="estado">
    <span id="est-db"><span class="dot"></span>base</span>
    <span id="est-cola" class="mono">cola: —</span>
    <button class="sec" id="btn-clave" style="padding:5px 10px">Clave</button>
  </div>
</header>

<main>
  <!-- Columna izquierda: ejecutar -->
  <section class="card">
    <h2>Ejecutar consulta</h2>
    <label for="f-cliente">Cliente</label>
    <select id="f-cliente"></select>
    <label for="f-modulo">Automatización</label>
    <select id="f-modulo"></select>
    <div id="f-params"></div>
    <label for="f-modo">Modo</label>
    <select id="f-modo">
      <option value="sync">Esperar resultado (sync)</option>
      <option value="async">En segundo plano (async)</option>
    </select>
    <div class="acciones">
      <button id="btn-ejecutar">Ejecutar</button>
      <button class="sec" id="btn-refrescar">Refrescar historial</button>
    </div>
    <div id="sesion-info"></div>

    <h2 style="margin-top:22px">Configuración del cliente</h2>
    <div id="config-box"><p class="vacio">Elija un cliente y una automatización.</p></div>
  </section>

  <!-- Columna derecha: historial + detalle -->
  <section class="card">
    <div class="tabs">
      <button id="tab-hist" class="activo">Historial</button>
      <button id="tab-det">Detalle</button>
    </div>
    <div id="panel-hist">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Hora</th><th>Cliente</th><th>Automatización</th><th>Estado</th><th>Resultado</th></tr></thead>
          <tbody id="hist-body"></tbody>
        </table>
      </div>
      <p id="hist-vacio" class="vacio" hidden>Sin consultas todavía.</p>
    </div>
    <div id="panel-det" hidden></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
// La clave puede venir en la URL (?k=...) para abrir el panel directo; se guarda y se limpia de la barra.
const _urlKey = new URLSearchParams(location.search).get('k');
if (_urlKey){ localStorage.setItem('adminKey', _urlKey); history.replaceState(null,'',location.pathname); }
let CLAVE = localStorage.getItem('adminKey') || '';
let CLIENTES = [];
let MODULOS = [];
let detalleTimer = null;

function pedirClave(){
  const v = prompt('Clave de operador (ADMIN_KEY):', CLAVE || '');
  if (v !== null){ CLAVE = v.trim(); localStorage.setItem('adminKey', CLAVE); iniciar(); }
}
$('#btn-clave').onclick = pedirClave;

async function api(ruta, opciones={}){
  const r = await fetch('/admin/api'+ruta, {
    ...opciones,
    headers: { 'x-admin-key': CLAVE, 'content-type':'application/json', ...(opciones.headers||{}) },
  });
  if (r.status === 401){ throw new Error('Clave de operador inválida'); }
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.mensaje || j.error || ('Error '+r.status));
  return j;
}

function fmtHora(s){ return s ? new Date(s).toLocaleString('es-CO',{hour12:false,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'; }

async function refrescarEstado(){
  try{
    const e = await api('/estado');
    $('#est-db').innerHTML = '<span class="dot on"></span>base';
    $('#est-cola').textContent = 'cola: '+e.pendientes+' pend / '+e.enProceso+' en curso';
    MODULOS = e.modulos;
  }catch(err){
    $('#est-db').innerHTML = '<span class="dot off"></span>'+ (err.message.includes('inválida')?'sin clave':'sin conexión');
  }
}

async function cargarClientes(){
  const { clientes } = await api('/clientes');
  CLIENTES = clientes;
  const sel = $('#f-cliente');
  sel.innerHTML = clientes.map(c=>`<option value="${c.slug}">${c.nombre}</option>`).join('') || '<option value="">(sin clientes)</option>';
  onClienteCambia();
}

function onClienteCambia(){
  const cl = CLIENTES.find(c=>c.slug===$('#f-cliente').value);
  const sel = $('#f-modulo');
  const mods = cl ? cl.modulos.filter(m=>m.activo) : [];
  sel.innerHTML = mods.map(m=>`<option value="${m.nombre}">${m.nombre}</option>`).join('') || '<option value="">(sin módulos)</option>';
  pintarSesion(cl);
  onModuloCambia();
}

function pintarSesion(cl){
  const box = $('#sesion-info');
  if (!cl || !cl.sesiones.length){ box.innerHTML = '<div class="aviso">Sin sesión guardada. La primera consulta abrirá una ventana para iniciar sesión a mano.</div>'; return; }
  box.innerHTML = cl.sesiones.map(s=>{
    const est = s.valida ? 'válida' : 'expirada';
    return `<div class="aviso" style="background:${s.valida?'var(--ok-soft)':'var(--warn-soft)'};color:${s.valida?'var(--ok)':'var(--warn)'}">Sesión ${s.portal}: ${est} (${s.origen}, ${fmtHora(s.actualizada)})</div>`;
  }).join('');
}

// Construye el formulario de parámetros a partir del esquema conocido del módulo.
const ESQUEMAS = {
  'sanitas-autorizaciones': [
    {n:'tipo_doc', etq:'Tipo de documento', tipo:'select', ops:['CC','TI','CE','PA','RC','PE','PT','AS','MS','NU','CD','SC'], def:'CC'},
    {n:'num_doc', etq:'Número de documento', tipo:'text', req:true, ph:'79589789'},
    {n:'cups', etq:'CUPS del servicio (opcional)', tipo:'text', ph:'890328'},
    {n:'fecha_cita', etq:'Fecha de la cita (opcional)', tipo:'date'},
    {n:'contrato', etq:'Contrato', tipo:'select', ops:['AUTO','EPS','PAC'], def:'AUTO'},
  ],
};
function onModuloCambia(){
  const m = $('#f-modulo').value;
  const campos = ESQUEMAS[m] || [{n:'_json', etq:'Parámetros (JSON)', tipo:'json'}];
  $('#f-params').innerHTML = campos.map(c=>{
    if (c.tipo==='select') return `<label>${c.etq}</label><select data-p="${c.n}">${c.ops.map(o=>`<option${o===c.def?' selected':''}>${o}</option>`).join('')}</select>`;
    if (c.tipo==='json') return `<label>${c.etq}</label><textarea data-p="${c.n}">{}</textarea>`;
    return `<label>${c.etq}</label><input data-p="${c.n}" type="${c.tipo}" placeholder="${c.ph||''}">`;
  }).join('');
  pintarConfig(m);
}

function pintarConfig(nombreMod){
  const cl = CLIENTES.find(c=>c.slug===$('#f-cliente').value);
  const mod = cl && cl.modulos.find(m=>m.nombre===nombreMod);
  const box = $('#config-box');
  if (!mod){ box.innerHTML = '<p class="vacio">Sin módulo seleccionado.</p>'; return; }
  box.innerHTML = `<label>Config de <span class="mono">${nombreMod}</span> (JSON)</label>
    <textarea id="config-json">${JSON.stringify(mod.config||{},null,2)}</textarea>
    <div class="acciones"><button class="sec" id="btn-config">Guardar configuración</button></div>`;
  $('#btn-config').onclick = async ()=>{
    let cfg; try{ cfg = JSON.parse($('#config-json').value); }catch{ return alert('JSON inválido'); }
    try{
      await api(`/clientes/${cl.slug}/modulos/${nombreMod}/config`, {method:'PUT', body:JSON.stringify(cfg)});
      await cargarClientes(); alert('Configuración guardada');
    }catch(e){ alert(e.message); }
  };
}

function leerParams(){
  const p = {};
  document.querySelectorAll('#f-params [data-p]').forEach(el=>{
    const k = el.dataset.p; const v = el.value.trim();
    if (k==='_json'){ Object.assign(p, JSON.parse(v||'{}')); return; }
    if (v!=='') p[k]=v;
  });
  return p;
}

async function ejecutar(){
  const cliente = $('#f-cliente').value, modulo = $('#f-modulo').value, modo = $('#f-modo').value;
  if (!cliente || !modulo) return alert('Elija cliente y automatización');
  let parametros; try{ parametros = leerParams(); }catch{ return alert('Parámetros JSON inválidos'); }
  const btn = $('#btn-ejecutar'); btn.disabled = true; btn.textContent = modo==='sync'?'Ejecutando…':'Encolando…';
  try{
    const t = await api('/ejecutar', {method:'POST', body:JSON.stringify({cliente,modulo,parametros,modo})});
    await cargarHistorial();
    verDetalle(t.id);
    if (modo==='async') seguirDetalle(t.id);
  }catch(e){ alert(e.message); }
  finally{ btn.disabled=false; btn.textContent='Ejecutar'; }
}

async function cargarHistorial(){
  try{
    const { trabajos } = await api('/trabajos?limite=60');
    const body = $('#hist-body');
    $('#hist-vacio').hidden = trabajos.length>0;
    body.innerHTML = trabajos.map(t=>`<tr data-id="${t.id}">
      <td class="mono">${fmtHora(t.creado)}</td><td>${t.cliente}</td><td>${t.modulo}</td>
      <td><span class="pill ${t.estado}">${t.estado}</span></td>
      <td>${t.semaforo?`<span class="sem ${t.semaforo}">${t.semaforo}</span>`:(t.error?`<span class="mono" style="color:var(--crit)">${t.error}</span>`:'—')}</td>
    </tr>`).join('');
    body.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>verDetalle(tr.dataset.id));
  }catch(e){ /* silencioso */ }
}

function seguirDetalle(id){
  clearInterval(detalleTimer);
  detalleTimer = setInterval(async ()=>{
    const t = await api('/trabajos/'+id).catch(()=>null);
    if (!t) return;
    if (t.estado==='completado' || t.estado==='fallido'){ clearInterval(detalleTimer); cargarHistorial(); }
    pintarDetalle(t);
  }, 3000);
}

async function verDetalle(id){
  const t = await api('/trabajos/'+id).catch(e=>({error:e.message}));
  cambiarTab('det'); pintarDetalle(t);
}

function pintarDetalle(t){
  const box = $('#panel-det');
  if (t.error && !t.id){ box.innerHTML = `<p class="vacio">${t.error}</p>`; return; }
  const caps = (t.capturas||[]).map(u=>{
    const src = u.startsWith('/admin') ? u+'&k='+encodeURIComponent(CLAVE) : u;
    return `<a href="${src}" target="_blank"><img src="${src}" alt="captura"></a>`;
  }).join('');
  box.innerHTML = `
    <div class="kv">
      <b>ID</b><span class="mono">${t.id}</span>
      <b>Cliente</b><span>${t.cliente}</span>
      <b>Automatización</b><span>${t.modulo}</span>
      <b>Estado</b><span><span class="pill ${t.estado}">${t.estado}</span> ${t.semaforo?`<span class="sem ${t.semaforo}">${t.semaforo}</span>`:''}</span>
      <b>Parámetros</b><span class="mono">${JSON.stringify(t.parametros)}</span>
      ${t.error?`<b>Error</b><span style="color:var(--crit)">${t.error}: ${t.error_mensaje||''}</span>`:''}
      <b>Duración</b><span>${t.duracion_ms?(t.duracion_ms/1000).toFixed(1)+' s':'—'}</span>
    </div>
    ${caps?`<label>Capturas</label><div class="capturas">${caps}</div>`:''}
    <label style="margin-top:14px">Resultado</label>
    <pre>${t.resultado?JSON.stringify(t.resultado,null,2):'(sin resultado)'}</pre>`;
}

function cambiarTab(cual){
  $('#tab-hist').classList.toggle('activo', cual==='hist');
  $('#tab-det').classList.toggle('activo', cual==='det');
  $('#panel-hist').hidden = cual!=='hist';
  $('#panel-det').hidden = cual!=='det';
}
$('#tab-hist').onclick=()=>cambiarTab('hist');
$('#tab-det').onclick=()=>cambiarTab('det');
$('#f-cliente').onchange=onClienteCambia;
$('#f-modulo').onchange=()=>onModuloCambia();
$('#btn-ejecutar').onclick=ejecutar;
$('#btn-refrescar').onclick=cargarHistorial;

async function iniciar(){
  await refrescarEstado();
  try{ await cargarClientes(); await cargarHistorial(); }
  catch(e){ if(e.message.includes('inválida')||!CLAVE) pedirClave(); }
}
if (!CLAVE) pedirClave(); else iniciar();
setInterval(refrescarEstado, 8000);
</script>
</body>
</html>
