<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Seguimiento de consultas · StartIA</title>
<style>
:root{
  --ground:#f3f5f8; --paper:#fff; --paper-2:#eef1f6; --ink:#152238; --ink-2:#3e4c63;
  --muted:#6b778c; --line:#dde2ea; --line-2:#c3cbd8; --accent:#0f7b86; --accent-ink:#0b5d66;
  --accent-soft:#ddf0f2; --ok:#2e7d4f; --ok-soft:#e1f2e7; --warn:#a9641a; --warn-soft:#fbebd5;
  --crit:#b23a3a; --crit-soft:#f7e0e0; --shadow:0 1px 2px rgba(21,34,56,.06),0 8px 24px -12px rgba(21,34,56,.18);
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --sans:"Segoe UI",system-ui,ui-sans-serif,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0e1524; --paper:#161f31; --paper-2:#1d2839; --ink:#e8edf5; --ink-2:#c0cadb;
  --muted:#8a97ac; --line:#2a3649; --line-2:#3a475c; --accent:#4cc1ca; --accent-ink:#8fdde3;
  --accent-soft:#12303a; --ok:#6ccb92; --ok-soft:#173225; --warn:#e3a45a; --warn-soft:#3a2a14;
  --crit:#f08585; --crit-soft:#3a1c1c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
a{color:var(--accent-ink)}
.marco{max-width:1060px;margin:0 auto;padding:22px 20px 48px}
.sup{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.sup b{display:block;font-size:15px} .sup small{display:block;color:var(--muted);font-size:12.5px}
.cabeza{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);font-weight:700}
h1{font-size:24px;line-height:1.25;margin:4px 0 4px;text-wrap:balance}
.lead{margin:0;color:var(--ink-2)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.acento{background:var(--accent-soft);color:var(--accent-ink)}
.barra{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--paper-2)}
.barra span{display:block;height:100%}
.seg-ok{background:var(--ok)} .seg-err{background:var(--crit)} .seg-curso{background:var(--warn)}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.cifra{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cifra b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.cifra span{font-size:12px;color:var(--muted)}
.cifra.ok b{color:var(--ok)} .cifra.crit b{color:var(--crit)} .cifra.warn b{color:var(--warn)}
.ayuda{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.boton{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;text-decoration:none;display:inline-block}
.boton.sec{background:transparent;color:var(--accent-ink)}
.boton:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabla-cab{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.tabla-cab h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.segmento{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--paper-2);border:1px solid var(--line)}
.segmento button{font:inherit;background:transparent;border:0;color:var(--ink-2);padding:6px 13px;border-radius:7px;cursor:pointer}
.segmento button.act{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(21,34,56,.18);font-weight:600}
.tabla-wrap{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--paper);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:12.5px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;background:var(--paper-2);color:var(--muted)}
.pill.en_proceso{background:var(--warn-soft);color:var(--warn)} .pill.completado{background:var(--ok-soft);color:var(--ok)} .pill.fallido{background:var(--crit-soft);color:var(--crit)} .pill.programado{background:var(--accent-soft);color:var(--accent-ink)}
.res{display:grid;gap:1px;font-size:12.5px} .res b{color:var(--muted);font-weight:600}
.err{color:var(--crit)}
.pie{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:16px}
.vacio{text-align:center;padding:56px 20px}
.vacio b{display:block;font-size:18px;margin-bottom:6px}
.vacio span{color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.barra span{transition:width .4s ease}}
</style>
</head>
<body>
<div class="marco">
  <header class="sup"><div class="logo" aria-hidden="true">S</div><div><b>Seguimiento de consultas</b><small id="cliente">StartIA Automatizaciones</small></div></header>
  <main id="contenido" aria-live="polite"><div class="card vacio"><span>Cargando…</span></div></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const ETQ = { programado: 'Programado', en_cola: 'En cola', procesando: 'Procesando', terminado: 'Terminado', cancelado: 'Cancelado' };
const CLASE = { programado: 'acento', en_cola: '', procesando: 'warn', terminado: 'ok', cancelado: 'crit' };
const ETQ_FILA = { programado: 'programada', pendiente: 'en cola', en_proceso: 'en curso', completado: 'completada', fallido: 'fallida' };
const base = location.pathname.replace(/\/+$/, '');
const fmt = (d) => new Date(d).toLocaleString('es-CO', { hour12: false, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const dur = (ms) => { const m = Math.round(ms / 60000); return m < 1 ? 'menos de un minuto' : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
let FILTRO = '', TIMER = null;

function seg(v, clase, total) { return v ? `<span class="${clase}" style="width:${(100 * v) / (total || 1)}%"></span>` : ''; }
function resultado(it) {
  if (it.error) return `<span class="err"><b>${esc(it.error.codigo)}</b> ${esc(it.error.mensaje)}</span>`;
  const r = it.resultado;
  if (r === null || r === undefined) return '<span style="color:var(--muted)">—</span>';
  if (typeof r !== 'object' || Array.isArray(r)) return `<span class="mono">${esc(JSON.stringify(r).slice(0, 160))}</span>`;
  const pares = Object.entries(r);
  return `<div class="res">${pares.slice(0, 6).map(([k, v]) => `<span><b>${esc(k)}:</b> ${esc(v !== null && typeof v === 'object' ? (Array.isArray(v) ? `${v.length} elementos` : JSON.stringify(v).slice(0, 80)) : v)}</span>`).join('')}${pares.length > 6 ? `<span style="color:var(--muted)">y ${pares.length - 6} campos más en el Excel</span>` : ''}</div>`;
}
function error(titulo, texto) {
  $('#contenido').innerHTML = `<div class="card vacio"><b>${esc(titulo)}</b><span>${esc(texto)}</span></div>`;
  document.title = `${titulo} · StartIA`;
}
function pintar(l) {
  $('#cliente').textContent = l.cliente_nombre;
  document.title = `${l.nombre || 'Lote de consultas'} · Seguimiento`;
  const c = l.contadores, hechas = c.completado + c.fallido;
  const params = [...new Set(l.items.flatMap((it) => Object.keys(it.parametros)))];
  const tiempo = l.estado === 'programado' && l.programado_para ? `Empieza ${fmt(l.programado_para)}.`
    : l.estado === 'terminado' ? `Terminó ${l.terminado_en ? fmt(l.terminado_en) : ''}.`
    : l.estado === 'cancelado' ? 'El lote se canceló; las consultas que no alcanzaron a hacerse aparecen como fallidas.'
    : l.restante_ms ? `Faltan unos ${dur(l.restante_ms)}. Esta página se actualiza sola.` : '';
  const filtros = [['', 'Todas'], ['completado', 'Completadas'], ['fallido', 'Fallidas'], ['activos', 'Sin terminar']];
  $('#contenido').innerHTML = `
    <div class="cabeza">
      <div><p class="eyebrow">${esc(l.modulo)}</p><h1>${esc(l.nombre || 'Lote de consultas')}</h1><p class="lead">${hechas} de ${l.total} consultas terminadas</p></div>
      <span class="chip ${CLASE[l.estado] || ''}">${esc(ETQ[l.estado] || l.estado)}</span>
    </div>
    <div class="card">
      <div class="barra" role="img" aria-label="${hechas} de ${l.total} consultas terminadas">${seg(c.completado, 'seg-ok', l.total)}${seg(c.fallido, 'seg-err', l.total)}${seg(c.en_proceso, 'seg-curso', l.total)}</div>
      <div class="cifras">
        <div class="cifra ok"><b>${c.completado}</b><span>Completadas</span></div>
        <div class="cifra crit"><b>${c.fallido}</b><span>Fallidas</span></div>
        <div class="cifra warn"><b>${c.en_proceso}</b><span>En curso</span></div>
        <div class="cifra"><b>${c.pendiente + c.programado}</b><span>${c.programado ? 'Programadas' : 'En cola'}</span></div>
      </div>
      <p class="ayuda">${esc(tiempo)}</p>
      <div class="acciones"><a class="boton" href="${base}/resultado?formato=xlsx">Descargar Excel</a><a class="boton sec" href="${base}/resultado?formato=csv">Descargar CSV</a></div>
    </div>
    <div class="card">
      <div class="tabla-cab"><h2>Consultas</h2><div class="segmento" role="group" aria-label="Filtrar consultas">${filtros.map(([f, t]) => `<button type="button" data-f="${f}"${f === FILTRO ? ' class="act"' : ''}>${t}</button>`).join('')}</div></div>
      <div class="tabla-wrap"><table>
        <thead><tr><th>Fila</th>${params.map((p) => `<th>${esc(p)}</th>`).join('')}<th>Estado</th><th>Resultado</th></tr></thead>
        <tbody>${l.items.map((it) => `<tr><td class="mono">${it.indice + 1}</td>${params.map((p) => `<td class="mono">${esc(it.parametros[p] ?? '')}</td>`).join('')}<td><span class="pill ${esc(it.estado)}">${esc(ETQ_FILA[it.estado] || it.estado)}</span></td><td>${resultado(it)}</td></tr>`).join('') || `<tr><td colspan="${params.length + 3}" style="text-align:center;color:var(--muted);padding:24px">No hay consultas con este filtro.</td></tr>`}</tbody>
      </table></div>
    </div>
    <p class="pie"><span>${l.enmascarado ? 'Los documentos y nombres se muestran parcialmente.' : ''}</span><span>Enlace válido hasta ${l.vence ? esc(fmt(l.vence)) : '—'}.</span><span>StartIA Automatizaciones</span></p>`;
  document.querySelectorAll('.segmento button').forEach((b) => (b.onclick = () => { FILTRO = b.dataset.f; cargar(); }));
}
async function cargar() {
  clearTimeout(TIMER);
  let r, j;
  try {
    r = await fetch(base + '/datos' + (FILTRO ? '?estado=' + encodeURIComponent(FILTRO) : ''), { cache: 'no-store' });
    j = await r.json();
  } catch {
    error('No se pudo cargar el seguimiento', 'Revise la conexión; la página lo intentará de nuevo en unos segundos.');
    TIMER = setTimeout(cargar, 15000);
    return;
  }
  if (r.status === 410) return error('Este enlace venció', j.mensaje || 'Pida uno nuevo a quien se lo compartió.');
  if (!r.ok) return error('Enlace no disponible', j.mensaje || 'Este enlace no existe o fue revocado.');
  pintar(j);
  if (['programado', 'en_cola', 'procesando'].includes(j.estado)) TIMER = setTimeout(cargar, 10000);
}
cargar();
</script>
</body>
</html>
